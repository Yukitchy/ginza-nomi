const fb=`this.onerror=null;this.style.display='none'`;
// hero mosaic
const cls=['b','s','s','tall','s','s','b','s','wide'];
document.getElementById('mos').innerHTML=S.map((s,i)=>`<i class="m ${cls[i]}"><img src="${s.img}" alt="" onerror="${fb}"><b>${esc(s.n)}</b></i>`).join('');
for(const a of['walk','car'])document.getElementById('g-'+a).innerHTML=S.filter(s=>s.a===a).map(s=>{const x=st(s);return`
<article class="tile${s.w?' wide':''}" data-id="${s.id}"><button class="open" type="button" data-pop="p-${s.id}" aria-label="${esc(s.n)}のくわしい情報"><img src="${s.img}" alt="" loading="lazy" onerror="${fb}"><span class="tx"><small>${esc(s.g)}</small><strong>${esc(s.n)}</strong><em>${esc(s.p)}</em></span></button>
<span class="fl${x.on?' on':''}" data-st="${s.id}">${esc(x.l)}</span>
<button class="vote" type="button" data-id="${s.id}" aria-pressed="false" aria-label="${esc(s.n)}に♥">${HEART}<b class="vc">0</b></button></article>`}).join('');
document.getElementById('pops').innerHTML=S.map(s=>{const map='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(s.n+' 坂戸')+'&query_place_id='+s.pid;return`
<dialog class="pop" id="p-${s.id}"><button class="pclose" type="button" aria-label="閉じる">✕</button><div class="pimg"><img src="${s.img}" alt="" loading="lazy" onerror="${fb}"></div><div class="pb">
<p class="gn">${esc(s.g)}${s.tg?`<span class="tg">${esc(s.tg)}</span>`:''}</p><h3>${esc(s.n)}</h3><p class="why">${esc(s.why)}</p>
<dl><dt>お値段</dt><dd>${esc(s.p)}</dd><dt>行き方</dt><dd>${esc(s.go)}</dd><dt>席</dt><dd>${esc(s.seat)}</dd><dt>今日の営業</dt><dd>${esc(today(s))}</dd><dt>定休日</dt><dd>${esc(s.off)}</dd><dt>おすすめ</dt><dd>${esc(s.pick)}</dd><dt>駐車場</dt><dd>${esc(s.park)}</dd><dt>電話</dt><dd><a class="tel" href="tel:${s.tel.replace(/-/g,'')}">${esc(s.tel)}</a></dd></dl>
<div class="lks"><a class="lk" href="${map}" target="_blank" rel="noopener">Googleマップで見る ›</a></div>
<button class="vote big" type="button" data-id="${s.id}" aria-pressed="false" aria-label="${esc(s.n)}に♥">${HEART}<b class="vc">0</b></button>
<p class="cr">イメージ写真</p></div></dialog>`}).join('');
function refreshStatus(){S.forEach(s=>{const x=st(s),el=document.querySelector(`[data-st="${s.id}"]`);el.textContent=x.l;el.classList.toggle('on',!!x.on)})}
setInterval(refreshStatus,60000);
// votes (銀座ページと同じ集計サーバー。IDは ks- で区別)
const API='https://ginza-nomi-vote.icchan417.workers.dev/votes',K=id=>'ks-'+id;
let counts={};
const mine=id=>{try{return localStorage.getItem('kv:'+id)==='1'}catch(e){return false}};
const setMine=(id,v)=>{try{v?localStorage.setItem('kv:'+id,'1'):localStorage.removeItem('kv:'+id)}catch(e){}};
function paint(){
 document.querySelectorAll('.vote').forEach(b=>{const id=b.dataset.id;b.setAttribute('aria-pressed',mine(id));b.querySelector('.vc').textContent=counts[K(id)]||0});
 document.querySelectorAll('.tile').forEach(t=>t.classList.toggle('mine',mine(t.dataset.id)));
}
async function load(){try{const r=await fetch(API,{cache:'no-store'});if(!r.ok)throw 0;counts=await r.json()}catch(e){}paint()}
async function vote(id,forceOn){
 if(forceOn&&mine(id))return;
 const on=!mine(id);setMine(id,on);counts[K(id)]=Math.max(0,(counts[K(id)]||0)+(on?1:-1));paint();
 try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:K(id),d:on?1:-1})});if(!r.ok)throw 0;counts=await r.json()}catch(e){}
 paint();
}
document.querySelectorAll('.vote').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();vote(b.dataset.id)}));
const HP='<svg class="hp" viewBox="0 0 24 24"><path d="M12 21s-8.5-5.3-8.5-11.6A4.9 4.9 0 0 1 12 6.6a4.9 4.9 0 0 1 8.5 2.8C20.5 15.7 12 21 12 21z"/></svg>';
document.querySelectorAll('.open').forEach(b=>{let last=0,t;b.addEventListener('click',()=>{
 const n=Date.now();
 if(n-last<320){clearTimeout(t);last=0;const tile=b.parentNode;tile.insertAdjacentHTML('beforeend',HP);const h=tile.lastChild;setTimeout(()=>h.remove(),750);vote(tile.dataset.id,true)}
 else{last=n;t=setTimeout(()=>document.getElementById(b.dataset.pop).showModal(),300)}
})});
document.querySelectorAll('dialog.pop').forEach(d=>{d.querySelector('.pclose').addEventListener('click',()=>d.close());d.addEventListener('click',e=>{if(e.target===d)d.close()})});
paint();load();setInterval(()=>{if(!document.hidden)load()},20000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){load();refreshStatus()}});
</script>
</body>
</html>
